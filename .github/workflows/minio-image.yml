name: Build imagem MinIO

on:
  workflow_dispatch:
  push:
    paths:
      - "docker/minio/**"
      - ".github/workflows/minio-image.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: docker/minio
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/minio:RELEASE.2024-01-13T07-53-03Z
            ghcr.io/${{ github.repository_owner }}/minio:2024-full-console
